<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Conecta+ — pedidos, clientes, vendas, estoque e fiado em um só lugar para pequenos negócios.">
<title>Conecta+</title>

<link rel="icon" href="/images/logo-conecta.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- CSS organizado por modulo (ver frontend/css/) -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/landing.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/app-layout.css">
<link rel="stylesheet" href="/css/cliente.css">
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<!--
  JS organizado por modulo (ver frontend/js/). Scripts classicos (sem
  type="module") carregados em ordem de dependencia com "defer".
  Caminhos absolutos (a partir de "/") porque as rotas usam URLs reais
  (History API, ex.: /gerente/estoque) — caminho relativo quebraria
  nessas rotas internas. Ver frontend/vercel.json para o rewrite que
  faz o reload funcionar em qualquer rota.
-->
<script src="/js/utils.js" defer></script>
<script src="/js/icons.js" defer></script>
<script src="/js/data.js" defer></script>
<script src="/js/state.js" defer></script>
<script src="/js/router.js" defer></script>
<script src="/js/components.js" defer></script>
<script src="/js/screens/landing.js" defer></script>
<script src="/js/screens/auth.js" defer></script>
<script src="/js/screens/cliente.js" defer></script>
<script src="/js/screens/gerente.js" defer></script>
<script src="/js/screens/funcionario.js" defer></script>
<script src="/js/screens/fluxo-dados.js" defer></script>
<script src="/js/not-found.js" defer></script>
<script src="/js/main.js" defer></script>
</body>
</html>
